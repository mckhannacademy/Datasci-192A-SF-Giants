<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg0: #0b0e14; --bg1: #111620; --bg2: #161d2b; --bg3: #1c2538; --bg4: #222d42;
    --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.13);
    --text0: #e8ecf4; --text1: #a8b2c8; --text2: #5e6e8a;
    --accent: #3d7fff; --accent2: #1a56cc; --warm: #f5803e; --cold: #40b4e5;
    --green: #34c77b; --amber: #f5c842; --red: #e85050; --wind: #9b6fff;
    --font-h: 'Barlow Condensed', sans-serif; --font-b: 'Barlow', sans-serif; --font-m: 'DM Mono', monospace;
  }

  body { background: var(--bg0); color: var(--text0); font-family: var(--font-b); font-size: 13px; min-height: 100vh; }
  .shell { display: grid; grid-template-rows: 52px 1fr; min-height: 100vh; }
  .topbar { background: var(--bg1); border-bottom: 1px solid var(--line2); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
  .topbar-logo { font-family: var(--font-h); font-weight: 700; font-size: 18px; letter-spacing: 0.08em; color: var(--text0); white-space: nowrap; }
  .topbar-logo span { color: var(--accent); }
  .topbar-divider { width: 1px; height: 24px; background: var(--line2); }
  .topbar-label { font-size: 11px; color: var(--text2); letter-spacing: 0.06em; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .status-label { font-size: 11px; color: var(--text2); letter-spacing: 0.05em; }

  .body { display: grid; grid-template-columns: 260px 1fr; overflow: hidden; height: calc(100vh - 52px); }

  .sidebar { background: var(--bg1); border-right: 1px solid var(--line2); overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 20px; }
  .sidebar-section-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); padding: 0 6px; margin-bottom: 6px; }
  .stadium-search { background: var(--bg3); border: 1px solid var(--line2); color: var(--text0); padding: 7px 10px; border-radius: 6px; font-family: var(--font-b); font-size: 12px; width: 100%; margin-bottom: 6px; }
  .stadium-search:focus { outline: none; border-color: var(--accent); }
  .stadium-search::placeholder { color: var(--text2); }
  .stadium-list { display: flex; flex-direction: column; gap: 2px; }
  .stadium-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
  .stadium-item:hover { background: var(--bg3); }
  .stadium-item.active { background: var(--bg3); border-color: var(--accent); }
  .stadium-item.hidden { display: none; }
  .stadium-abbr { font-family: var(--font-h); font-weight: 700; font-size: 14px; color: var(--accent); width: 32px; flex-shrink: 0; }
  .stadium-meta { flex: 1; min-width: 0; }
  .stadium-name { font-size: 12px; font-weight: 500; color: var(--text0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stadium-city { font-size: 11px; color: var(--text2); }
  .stadium-roof { font-size: 10px; background: rgba(61,127,255,0.15); color: var(--accent); border-radius: 3px; padding: 1px 5px; font-family: var(--font-m); flex-shrink: 0; }

  .date-block { display: flex; flex-direction: column; gap: 6px; }
  .date-block label { font-size: 11px; color: var(--text2); letter-spacing: 0.05em; }
  .date-block input[type="date"], .date-block select { background: var(--bg3); border: 1px solid var(--line2); color: var(--text0); padding: 7px 10px; border-radius: 6px; font-family: var(--font-b); font-size: 12px; width: 100%; cursor: pointer; }
  .date-block input[type="date"]:focus, .date-block select:focus { outline: none; border-color: var(--accent); }

  .weather-inputs { display: flex; flex-direction: column; gap: 10px; }
  .wx-row { display: flex; flex-direction: column; gap: 4px; }
  .wx-row label { font-size: 11px; color: var(--text2); display: flex; justify-content: space-between; }
  .wx-row label span { color: var(--text0); font-family: var(--font-m); font-size: 11px; }
  .wx-row input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

  .run-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 10px; font-family: var(--font-h); font-weight: 600; font-size: 14px; letter-spacing: 0.06em; cursor: pointer; text-transform: uppercase; transition: background 0.15s; }
  .run-btn:hover { background: var(--accent2); }

  .main { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .stadium-header { display: flex; align-items: flex-start; gap: 16px; }
  .stadium-title-block { flex: 1; }
  .stadium-title { font-family: var(--font-h); font-weight: 700; font-size: 28px; letter-spacing: 0.02em; line-height: 1; color: var(--text0); }
  .stadium-subtitle { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .stadium-blurb { font-size: 12px; color: var(--text2); line-height: 1.6; margin-top: 8px; max-width: 780px; border-left: 2px solid var(--bg4); padding-left: 10px; }
  .context-badges { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-family: var(--font-m); border-radius: 4px; padding: 3px 8px; }
  .badge-blue { background: rgba(61,127,255,0.15); color: var(--accent); }
  .badge-amber { background: rgba(245,200,66,0.15); color: var(--amber); }
  .badge-red { background: rgba(232,80,80,0.15); color: var(--red); }
  .badge-wind { background: rgba(155,111,255,0.15); color: var(--wind); }

  /* Edit 1: KPI row now only has 2 cards */
  .kpi-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi-card { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .kpi-card.up::before { background: var(--green); }
  .kpi-card.down::before { background: var(--red); }
  .kpi-card.neutral::before { background: var(--text2); }
  .kpi-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); }
  .kpi-value { font-family: var(--font-h); font-size: 28px; font-weight: 700; line-height: 1; }
  .kpi-value.up { color: var(--green); }
  .kpi-value.down { color: var(--red); }
  .kpi-value.neutral { color: var(--text1); }
  .kpi-desc { font-size: 11px; color: var(--text2); }
  .kpi-conf { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  .kpi-conf-label { font-size: 10px; color: var(--text2); }
  .kpi-conf-bar { flex: 1; height: 3px; background: var(--bg4); border-radius: 2px; }
  .kpi-conf-fill { height: 100%; border-radius: 2px; }

  .panel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-family: var(--font-h); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text1); }
  .panel-tag { font-size: 10px; font-family: var(--font-m); border-radius: 3px; padding: 2px 6px; background: var(--bg4); color: var(--text2); }

  .chart-area { position: relative; }

  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); padding: 0 8px 8px; text-align: left; border-bottom: 1px solid var(--line2); font-weight: 500; }
  .data-table td { padding: 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text1); vertical-align: middle; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--bg3); }
  .td-mono { font-family: var(--font-m); font-size: 11px; }

  .disclaimer { font-size: 11px; color: var(--text2); background: rgba(61,127,255,0.06); border: 1px solid rgba(61,127,255,0.18); border-radius: 6px; padding: 8px 12px; display: flex; gap: 8px; align-items: flex-start; }
  .disclaimer-icon { color: var(--accent); flex-shrink: 0; margin-top: 1px; }

  .section-divider { display: flex; align-items: center; gap: 10px; }
  .section-divider-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text0); white-space: nowrap; font-weight: 500; }
  .section-divider-line { flex: 1; height: 1px; background: var(--line2); }

  .dist-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; min-width: 0; }
  .dist-card { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow: hidden; }
  .dist-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); }
  .dist-stats { display: flex; justify-content: space-between; }
  .dist-stat { display: flex; flex-direction: column; gap: 2px; }
  .dist-stat-val { font-family: var(--font-m); font-size: 11px; color: var(--text0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dist-stat-lbl { font-size: 9px; color: var(--text2); }

  .heatmap-img-wrap { width: 100%; }
  .heatmap-img-wrap img { width: 100%; height: auto; display: block; border-radius: 4px; }
  .heatmap-img-placeholder { height: 160px; display: flex; align-items: center; justify-content: center; background: var(--bg3); border-radius: 6px; border: 1px dashed rgba(255,255,255,0.1); }
  .heatmap-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .heatmap-panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .heatmap-desc { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 16px; font-size: 12px; color: var(--text1); line-height: 1.7; }

  .regression-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .regression-panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .r2-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--bg4); border-radius: 4px; padding: 3px 8px; font-size: 11px; font-family: var(--font-m); color: var(--text1); }
  .r2-val { color: var(--amber); }
  .coef-table { width: 100%; border-collapse: collapse; }
  .coef-table th { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); padding: 0 8px 6px; text-align: left; border-bottom: 1px solid var(--line2); font-weight: 500; }
  .coef-table td { padding: 5px 8px; border-bottom: 1px solid var(--line); font-size: 11px; font-family: var(--font-m); color: var(--text1); }
  .coef-table tr:last-child td { border-bottom: none; }
  .coef-pos { color: var(--green); }
  .coef-neg { color: var(--red); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg1); }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
  select option { background: var(--bg2); }
  .page-btn { background: transparent; border: 1px solid var(--line2); color: var(--text2); padding: 5px 14px; border-radius: 5px; font-family: var(--font-h); font-size: 13px; letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s; }
  .page-btn:hover { border-color: var(--accent); color: var(--text0); }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Park photo + KPI top layout */
  .top-row { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .park-photo-wrap { position: relative; border-radius: 8px; overflow: hidden; background: var(--bg3); border: 1px solid var(--line2); aspect-ratio: unset; width: 100%; height: 100%; }
  .park-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .park-photo-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text2); font-size: 11px; font-family: var(--font-m); text-align: center; padding: 16px; min-height: 130px; }
  .park-photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 18px 10px 6px; font-size: 10px; font-family: var(--font-m); color: rgba(255,255,255,0.7); letter-spacing: 0.05em; }

  /* Day/Night toggle */
  .dn-toggle-wrap { display: flex; flex-direction: column; gap: 6px; }
  .dn-toggle-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); padding: 0 6px; }
  .dn-toggle { display: flex; background: var(--bg3); border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
  .dn-btn { flex: 1; padding: 8px 6px; border: none; background: transparent; color: var(--text2); font-family: var(--font-h); font-size: 13px; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .dn-btn:hover { color: var(--text0); }
  .dn-btn.active-day  { background: var(--amber); color: #1a1200; }
  .dn-btn.active-night { background: var(--accent2); color: #fff; }

  .pat-input { background: var(--bg3); border: 1px solid var(--line2); color: var(--text0); padding: 7px 10px; border-radius: 6px; font-family: var(--font-m); font-size: 11px; width: 100%; }
  .pat-input:focus { outline: none; border-color: var(--accent); }
  .pat-input::placeholder { color: var(--text2); }
  .pat-status { font-size: 10px; font-family: var(--font-m); padding: 3px 6px; border-radius: 4px; text-align: center; }
  .pat-status.ok    { background: rgba(52,199,123,0.15); color: var(--green); }
  .pat-status.err   { background: rgba(232,80,80,0.15);  color: var(--red); }
  .pat-status.idle  { background: var(--bg4); color: var(--text2); }
  .pat-status.loading { background: rgba(61,127,255,0.15); color: var(--accent); }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="topbar-logo">&#9928; PARK<span>CAST</span></div>
    <div class="topbar-divider"></div>
    <div class="topbar-label">MLB Weather Performance Intelligence</div>
    <div class="topbar-right">
      <div class="status-dot"></div>
      <div class="status-label">Model v1.0 — OLS + Park FE</div>
      <div class="topbar-divider"></div>
      <button class="page-btn active" id="btn-page1" onclick="setPage(1)">&#9650; Projections</button>
      <button class="page-btn" id="btn-page2" onclick="setPage(2)">&#128202; Analysis</button>
    </div>
  </div>
  <div class="body">
    <div class="sidebar">
      <div>
        <div class="sidebar-section-label">Stadium</div>
        <input class="stadium-search" type="text" placeholder="Search stadiums..." oninput="filterStadiums(this.value)">
        <div class="stadium-list" id="stadium-list"></div>
      </div>
      <div class="date-block">
        <div class="sidebar-section-label">Date &amp; Game Time</div>
        <label>Game Date</label>
        <input type="date" id="game-date" value="2025-07-15">
        <label>First Pitch</label>
        <select id="game-time">
          <option value="13">1:05 PM</option>
          <option value="16" selected>4:05 PM</option>
          <option value="19">7:05 PM</option>
          <option value="20">8:05 PM</option>
        </select>
      </div>
      <div class="weather-inputs">
        <div class="sidebar-section-label">Weather at First Pitch</div>
        <div class="wx-row">
          <label>Temperature (°F) <span id="temp-val">72</span></label>
          <input type="range" min="20" max="105" value="72" id="wx-temp" oninput="updateWx()">
        </div>
        <div class="wx-row">
          <label>Humidity (%) <span id="hum-val">55</span></label>
          <input type="range" min="0" max="100" value="55" id="wx-hum" oninput="updateWx()">
        </div>
        <div class="wx-row">
          <label>Wind Speed (mph) <span id="wind-val">12</span></label>
          <input type="range" min="0" max="40" value="12" id="wx-wind" oninput="updateWx()">
        </div>
        <div class="wx-row">
          <label>Wind Direction <span id="winddir-val">SW</span></label>
          <input type="range" min="0" max="315" step="45" value="225" id="wx-winddir" oninput="updateWx()">
        </div>
        <div class="wx-row">
          <label>Pressure (inHg) <span id="press-val">29.92</span></label>
          <input type="range" min="2890" max="3050" value="2992" id="wx-press" oninput="updateWx()">
        </div>
      </div>
      <div class="dn-toggle-wrap">
        <div class="dn-toggle-label">Game Type</div>
        <div class="dn-toggle">
          <button class="dn-btn active-day" id="dn-day" onclick="setDayNight('day')">&#9728; Day</button>
          <button class="dn-btn" id="dn-night" onclick="setDayNight('night')">&#9790; Night</button>
        </div>
      </div>
      <div class="pat-wrap">
        <div class="sidebar-section-label">GitHub Access</div>
        <input class="pat-input" type="password" id="gh-pat" placeholder="Paste GitHub PAT…" oninput="onPatInput()">
        <div class="pat-status idle" id="pat-status">No token — using placeholder data</div>
      </div>
      <button class="run-btn" onclick="runModel()">&#9654; Run Projection</button>
    </div>
    <div class="main" id="main-content"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const STADIUMS = [
  { abbr:'ARI', name:'Chase Field',              team:'Diamondbacks', city:'Phoenix, AZ',        roof:true,  orientation:270,
    blurb:"Chase Field sits in downtown Phoenix at 1,082 ft elevation. The retractable roof — closed for most summer day games when temps exceed 100°F — fundamentally decouples weather from playing conditions. When open: 330 ft LF, 407 ft CF, 334 ft RF. Natural grass. One of the most HR-friendly parks in the NL when the roof is open; air conditioning effects on ball flight are unquantified." },
  { abbr:'ATL', name:'Truist Park',              team:'Braves',       city:'Cumberland, GA',     roof:false, orientation:180,
    blurb:"Truist Park opened in 2017 in Cumberland, GA at ~1,050 ft elevation. Moderate symmetry: 335 ft LF, 400 ft CF, 325 ft RF. Natural grass. Warm, humid summers push HR rates up; the park plays slightly hitter-friendly. Prevailing winds off the Chattahoochee corridor are mild and inconsistent." },
  { abbr:'BAL', name:'Camden Yards',             team:'Orioles',      city:'Baltimore, MD',      roof:false, orientation:90,
    blurb:"Camden Yards opened in 1992 and set the template for retro ballparks. Downtown Baltimore, ~20 ft elevation. Asymmetric: 333 ft LF, 410 ft CF, 318 ft RF — the right field warehouse wall is a defining feature. Natural grass. Wind patterns from the Inner Harbor push predominantly from the southwest, often blowing out to left-center." },
  { abbr:'BOS', name:'Fenway Park',              team:'Red Sox',      city:'Boston, MA',         roof:false, orientation:135,
    blurb:"Fenway Park (1912) is MLB's oldest active ballpark at sea level in Kenmore Square. The Green Monster in LF stands 37 ft tall at 310 ft — the shortest LF line in MLB. CF is 420 ft to the triangle. Natural grass. Boston's marine climate produces cool, damp conditions; sea breeze from the east suppresses fly balls to right." },
  { abbr:'CHC', name:'Wrigley Field',            team:'Cubs',         city:'Chicago, IL',        roof:false, orientation:45,
    blurb:"Wrigley Field (1914) on Chicago's North Side. Nearly sea-level at 595 ft. Dimensions: 355 ft LF, 400 ft CF, 353 ft RF. Natural grass and ivy-covered walls. Wind off Lake Michigan is the dominant weather variable — northeast winds blow sharply in, suppressing HRs 15-20%; southwest winds blow out producing high-scoring games. The most wind-sensitive park in our dataset." },
  { abbr:'CIN', name:'Great American Ball Park', team:'Reds',         city:'Cincinnati, OH',     roof:false, orientation:90,
    blurb:"Great American Ball Park sits on the Ohio River waterfront in downtown Cincinnati at 490 ft elevation. Dimensions: 328 ft LF, 404 ft CF, 325 ft RF. Natural grass. River humidity elevates ball-carry in warm months. Southwesterly winds off the river corridor blow toward RF, creating a subtle HR-favorable channel." },
  { abbr:'CLE', name:'Progressive Field',        team:'Guardians',    city:'Cleveland, OH',      roof:false, orientation:135,
    blurb:"Progressive Field in downtown Cleveland at 653 ft elevation. Asymmetric: 325 ft LF, 405 ft CF, 325 ft RF. Natural grass. Lake Erie produces variable conditions — lake-effect cold snaps in April/May, humid summers, and strong northeast winds that can sharply suppress fly balls." },
  { abbr:'COL', name:'Coors Field',              team:'Rockies',      city:'Denver, CO',         roof:false, orientation:45, altitude:true,
    blurb:"Coors Field in LoDo Denver at 5,280 ft — the highest elevation in MLB by over 4,000 ft. Dimensions: 347 ft LF, 415 ft CF, 350 ft RF. Natural grass. Thin air reduces air resistance on fly balls, adding an estimated 8-10% carry vs. sea-level parks. OLS regression cannot capture elevation as a variable — it is a constant, not a covariate. Largest structural outlier in the dataset." },
  { abbr:'CWS', name:'Guaranteed Rate Field',    team:'White Sox',    city:'Chicago, IL',        roof:false, orientation:270,
    blurb:"Guaranteed Rate Field on Chicago's South Side at 595 ft elevation. Dimensions: 330 ft LF, 400 ft CF, 335 ft RF. Natural grass. Slightly more sheltered from Lake Michigan than Wrigley, but still subject to strong prevailing southwesterly winds. Plays more hitter-friendly than Wrigley on calm days." },
  { abbr:'DET', name:'Comerica Park',            team:'Tigers',       city:'Detroit, MI',        roof:false, orientation:315,

async function fetchHeatmapImages(abbr) {
  if (HEATMAP_CACHE[abbr]) return HEATMAP_CACHE[abbr];

  if (!pat) return null;

  const folder = FOLDER_ABBR[abbr] || abbr;

    rhum:     'heatmap_rhum_diff.png',
    wspd_mph: 'heatmap_wspd_mph_diff.png',
  };

  const result = {};
  for (const variable of variables) {
    const path = `analysis/cleaned_analysis/${folder}/${fileNames[variable]}`;
    try {
      const res = await fetch(
        `https://api.github.com/repos/mckhannacademy/Datasci-192A-SF-Giants/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`,

      result[variable] = `data:image/png;base64,${json.content.replace(/\n/g, '')}`;

// Minimal CSV parser (handles quoted fields)
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',');
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { vals.push(cur); cur = ''; }
      else cur += ch;
    }
    vals.push(cur);
    const row = {};
    headers.forEach((h, i) => { row[h.trim()] = (vals[i] || '').trim(); });
    return row;
  });
}

async function fetchStadiumData(abbr) {
  if (DATA_CACHE[abbr]) return DATA_CACHE[abbr];
  const pat = getPAT();
  if (!pat) return null;

  const slug = TEAM_SLUG[abbr];
  if (!slug) return null;

  setPatStatus('loading', `Scanning repo…`);

  try {
    // Step 1: use Git Trees API (recursive) — no file count limit unlike Contents API
    const treeRes = await fetch(
      `https://api.github.com/repos/mckhannacademy/Datasci-192A-SF-Giants/git/trees/main?recursive=1`,
      {
        headers: {
          'Authorization': `Bearer ${pat}`,
          'Accept': 'application/vnd.github.v3+json',
        }
      }
    );
    if (!treeRes.ok) {
      const err = await treeRes.json();
      setPatStatus('err', `✗ Tree access failed: ${treeRes.status} — ${err.message || ''}`);
      return null;
    }
    const tree = await treeRes.json();

    // Step 2: find all CSV files in /data matching this team slug
    const matching = tree.tree
      .filter(f => f.type === 'blob'
                && f.path.startsWith('data/')
                && f.path.includes(slug + '_data')
                && f.path.endsWith('.csv'))
      .map(f => f.path);

    if (matching.length === 0) {
      setPatStatus('err', `✗ No CSV files found for ${abbr} (slug: ${slug})`);
      return null;
    }

    // Prefer day_night files; sort descending so latest year first
    const dayNightFiles = matching.filter(p => p.includes('day_night')).sort().reverse();
    const plainFiles    = matching.filter(p => !p.includes('day_night')).sort().reverse();
    const filesToFetch  = dayNightFiles.length > 0 ? dayNightFiles : plainFiles;

    setPatStatus('loading', `Loading ${abbr} (${filesToFetch.length} files)…`);

    // Step 3: fetch each file via Contents API using its exact path
    let allRows = [];
    for (const path of filesToFetch) {
      const fileRes = await fetch(
        `https://api.github.com/repos/mckhannacademy/Datasci-192A-SF-Giants/contents/${path}`,
        {
          headers: {
            'Authorization': `Bearer ${pat}`,
            'Accept': 'application/vnd.github.v3+json',
          }
        }
      );
      if (!fileRes.ok) continue;
      const json = await fileRes.json();
      const text = atob(json.content.replace(/\n/g, ''));
      allRows = allRows.concat(parseCSV(text));
    }

    if (allRows.length === 0) {
      setPatStatus('err', `✗ Files found but could not parse data for ${abbr}`);
      return null;
    }

    // Fix CSV team abbreviation mismatches
    allRows.forEach(row => {
      if (CSV_ABBR_FIX[row.away_team]) row.away_team = CSV_ABBR_FIX[row.away_team];
    });

    // Deduplicate by game_pk in case files overlap
    const seen = new Set();
    DATA_CACHE[abbr] = allRows.filter(r => {
      if (seen.has(r.game_pk)) return false;
      seen.add(r.game_pk);
      return true;
    });

    setPatStatus('ok', `✓ ${abbr} loaded (${DATA_CACHE[abbr].length} games)`);
    return DATA_CACHE[abbr];

  } catch (e) {
    setPatStatus('err', `✗ ${abbr}: ${e.message}`);
    return null;
  }
}

// Find historical analog games: closest temp + wind matches
function findAnalogs(rows, wx, n = 6) {
  const dn = wx.dayNight;
  const scored = rows
    .filter(r => {
      const hasRuns = parseFloat(r.away_runs_scored) >= 0;
      const dnMatch = !r.day_night || r.day_night === dn;
      return hasRuns && dnMatch;
    })
    .map(r => {
      const tempDiff = Math.abs(parseFloat(r.temp_f) - wx.temp);
      const windDiff = Math.abs(parseFloat(r.wspd_mph) - wx.wind);
      const score    = tempDiff * 1.5 + windDiff;
      return { r, score };
    })
    .sort((a, b) => a.score - b.score)
    .slice(0, n)
    .map(x => x.r);
  return scored;
}

// Compute real per-game park factor from data rows
function computeRealParkFactors(rows) {
  return rows
    .filter(r => parseFloat(r.away_runs_scored) > 0)
    .map(r => ({
      date: r.game_date,
      pf:   +((parseFloat(r.home_runs_scored) / parseFloat(r.away_runs_scored)) * 100).toFixed(1),
    }))
    .sort((a, b) => a.date.localeCompare(b.date));
}

// Compute air density from temp (°F), relative humidity (%), and pressure (hPa)
function computeAirDensity(tempF, rhum, presHpa = 1013.25) {
  const tempK = (tempF - 32) * 5/9 + 273.15;
  const tempC = (tempF - 32) * 5/9;
  const eSat  = 6.1078 * Math.pow(10, (7.5 * tempC) / (tempC + 237.3));
  const e     = (rhum / 100) * eSat;
  const pD    = (presHpa - e) * 100;
  return pD / (287.05 * tempK) + (e * 100) / (461.5 * tempK);
}

// Decompose wind speed + direction into CF, LCF, RCF components
// stadiumOrientation = compass bearing of CF from home plate
function computeWindComponents(wspdMph, windDirDeg, stadiumOrientation) {
  // Angle of wind arrival relative to outfield orientation
  // windDirDeg is the direction the wind is blowing FROM (meteorological)
  // We want the component blowing toward CF (outward from home plate)
  const relDeg  = ((windDirDeg - stadiumOrientation) + 360) % 360;
  const relRad  = relDeg * Math.PI / 180;
  // CF component: positive = blowing out toward CF
  const wind_cf  = wspdMph * Math.cos(relRad);
  // LCF component: positive = blowing toward left-center
  const wind_lcf = wspdMph * Math.cos((relDeg - 30) * Math.PI / 180);
  // RCF component: positive = blowing toward right-center
  const wind_rcf = wspdMph * Math.cos((relDeg + 30) * Math.PI / 180);
  return { wind_cf, wind_lcf, wind_rcf };
}

function computeProjection(wx, stadium) {
  const isNight = wx.dayNight === 'night' ? 1 : 0;
  // Convert slider pressure from inHg to hPa (1 inHg = 33.8639 hPa)
  const presHpa = wx.press * 33.8639;

  const airDensity  = computeAirDensity(wx.temp, wx.hum, presHpa);
  const windComps   = computeWindComponents(wx.wind, wx.winddir, stadium.orientation);
  const windOutImpact = wx.wind * windComps.wind_cf;

  // Build raw feature map
  const raw = {
    temp_f:          wx.temp,
    rhum:            wx.hum,
    wspd_mph:        wx.wind,
    wind_cf:         windComps.wind_cf,
    wind_lcf:        windComps.wind_lcf,
    wind_rcf:        windComps.wind_rcf,
    air_density:     airDensity,
    wind_out_impact: windOutImpact,
  };

  // Standardize using training-set scaling params
  const scaled = {};
  for (const [feat, val] of Object.entries(raw)) {
    const { mean, std } = MODEL_PARAMS.scaling[feat];
    scaled[feat] = (val - mean) / std;
  }

  // Predict strikeouts (away team)
  const kFE = MODEL_PARAMS.strikeouts.fixed_effects;
  let kPred = kFE.Intercept;
  for (const feat of Object.keys(scaled)) kPred += kFE[feat] * scaled[feat];
  kPred += kFE.is_night * isNight;
  kPred += MODEL_PARAMS.strikeouts.park_effects[stadium.abbr] || 0;

  // Predict runs (away team)
  const rFE = MODEL_PARAMS.runs.fixed_effects;
  let rPred = rFE.Intercept;
  for (const feat of Object.keys(scaled)) rPred += rFE[feat] * scaled[feat];
  rPred += rFE.is_night * isNight;
  rPred += MODEL_PARAMS.runs.park_effects[stadium.abbr] || 0;

  // Baseline (neutral conditions, same park) for delta display
  const neutralWx = { temp: 72, hum: 62, wind: 7.6, winddir: stadium.orientation, press: 29.92, dayNight: 'day' };
  const neutralAD = computeAirDensity(72, 62, 29.92 * 33.8639);
  const neutralWC = computeWindComponents(7.6, stadium.orientation, stadium.orientation);
  const neutralWOI = 7.6 * neutralWC.wind_cf;
  const neutralRaw = { temp_f:72, rhum:62, wspd_mph:7.6,
    wind_cf: neutralWC.wind_cf, wind_lcf: neutralWC.wind_lcf, wind_rcf: neutralWC.wind_rcf,
    air_density: neutralAD, wind_out_impact: neutralWOI };
  const neutralScaled = {};
  for (const [feat, val] of Object.entries(neutralRaw)) {
    const { mean, std } = MODEL_PARAMS.scaling[feat];
    neutralScaled[feat] = (val - mean) / std;
  }
  let kBase = kFE.Intercept;
  for (const feat of Object.keys(neutralScaled)) kBase += kFE[feat] * neutralScaled[feat];
  kBase += MODEL_PARAMS.strikeouts.park_effects[stadium.abbr] || 0;
  let rBase = rFE.Intercept;
  for (const feat of Object.keys(neutralScaled)) rBase += rFE[feat] * neutralScaled[feat];
  rBase += MODEL_PARAMS.runs.park_effects[stadium.abbr] || 0;

  // windEffect kept for badge label and wind rose
  const windEffect = computeWindEffect(wx.wind, wx.winddir, stadium.orientation);

  // Park factor: ratio of weather-adjusted away runs vs. league-neutral baseline (4.55 runs/game),
  // scaled so that 100 = neutral. Higher PF = more runs suppressed by conditions (pitcher-friendly).
  // We use: PF = (rBase / rPred) × 100, so when weather inflates runs vs. baseline, PF < 100
  // and when weather suppresses runs, PF > 100 — matching the standard run-suppression convention
  // (park factor > 100 = hitter-friendly, < 100 = pitcher-friendly) by anchoring to rBase.
  // Actually: standard PF > 100 = hitter-friendly (more runs). We use rPred/rBase × 100.
  const parkFactor = +((rPred / rBase) * 100).toFixed(1);

  return {
    kPred:      +kPred.toFixed(2),
    rPred:      +rPred.toFixed(2),
    kDelta:     +(kPred - kBase).toFixed(2),
    runsDelta:  +(rPred - rBase).toFixed(2),
    rBase:      +rBase.toFixed(2),
    parkFactor,
    airDensity: +airDensity.toFixed(4),
    windEffect,
  };
}

function computeWindEffect(speed, dir, stadiumOrientation) {
  const rel = ((dir - stadiumOrientation) + 360) % 360;
  const radians = rel * Math.PI / 180;
  const outComponent   = Math.cos(radians);
  const crossComponent = Math.sin(radians);
  return {
    outBlow: +(outComponent * speed).toFixed(1),
    cross:   +(crossComponent * speed).toFixed(1),
    label: outComponent > 0.5 ? 'Blowing out' : outComponent < -0.5 ? 'Blowing in' : 'Crosswind',
    rel
  };
}

function renderStadiumList() {
  const el = document.getElementById('stadium-list');
  el.innerHTML = STADIUMS.map((s, i) => `
    <div class="stadium-item ${i===activeStadium?'active':''}" onclick="selectStadium(${i})">
      <div class="stadium-abbr">${s.abbr}</div>
      <div class="stadium-meta">
        <div class="stadium-name">${s.team}</div>
        <div class="stadium-city">${s.city}</div>
      </div>
      ${s.roof ? '<div class="stadium-roof">ROOF</div>' : ''}
    </div>
  `).join('');
}

function selectStadium(i) {
  activeStadium = i;
  projections   = null;
  stadiumRows   = null;
  stadiumPhoto  = null;
  renderStadiumList();
  renderMain();
}

async function runModel() {
  const wx = getWx();
  const stadium = STADIUMS[activeStadium];
  projections = computeProjection(wx, stadium);

  // Fetch data and photo in parallel
  [stadiumRows, stadiumPhoto] = await Promise.all([
    fetchStadiumData(stadium.abbr),
    fetchStadiumPhoto(stadium.abbr),
  ]);
  renderMain();
}

  const adLabel = adDiff > 0 ? `+${adDiff} kg/m³ (denser)` : `${adDiff} kg/m³ (thinner)`;

  document.getElementById('main-content').innerHTML = `
    <!-- OUTER GRID: left content column + tall photo on right -->
    <div style="display:grid;grid-template-columns:1fr 420px;gap:16px;align-items:stretch;">

      <!-- LEFT COLUMN: header info + KPI cards stacked -->
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="stadium-title-block">
          <div class="stadium-title">${stadium.name}</div>
          <div class="stadium-subtitle">${stadium.team} · ${stadium.city}</div>
          ${stadium.blurb ? `<div class="stadium-blurb">${stadium.blurb}</div>` : ''}
          <div class="context-badges">
            <span class="badge badge-blue">${wx.date}</span>
            <span class="badge badge-amber">${wx.temp}°F · ${wx.hum}% RH</span>
            <span class="badge badge-wind">Wind ${wx.wind} mph ${dirLabel(wx.winddir)} · ${p.windEffect.label}</span>
            <span class="badge badge-blue">${wx.press.toFixed(2)} inHg · ρ ${adLabel}</span>

// Build the model inputs table rows for the driver breakdown panel
function buildInputTable(wx, stadium, p) {
  const isNight   = wx.dayNight === 'night' ? 1 : 0;
  const presHpa   = wx.press * 33.8639;
  const airDensity = p.airDensity;
  const windComps  = computeWindComponents(wx.wind, wx.winddir, stadium.orientation);
  const windOutImpact = wx.wind * windComps.wind_cf;

  const raw = {
    temp_f:          wx.temp,
    rhum:            wx.hum,
    wspd_mph:        wx.wind,
    wind_cf:         windComps.wind_cf,
    wind_lcf:        windComps.wind_lcf,
    wind_rcf:        windComps.wind_rcf,
    air_density:     airDensity,
    wind_out_impact: windOutImpact,
  };

  const LABELS = {
    temp_f:'Temperature (°F)', rhum:'Humidity (%)', wspd_mph:'Wind speed (mph)',
    wind_cf:'Wind → CF', wind_lcf:'Wind → LCF', wind_rcf:'Wind → RCF',
    air_density:'Air density (kg/m³)', wind_out_impact:'Wind out impact'
  };

  const rFE = MODEL_PARAMS.runs.fixed_effects;
  const kFE = MODEL_PARAMS.strikeouts.fixed_effects;

  let rows = '';
  for (const [feat, val] of Object.entries(raw)) {
    const { mean, std } = MODEL_PARAMS.scaling[feat];
    const z    = (val - mean) / std;
    const rCon = rFE[feat] * z;
    const kCon = kFE[feat] * z;
    const rCol = rCon > 0.01 ? 'coef-pos' : rCon < -0.01 ? 'coef-neg' : '';
    const kCol = kCon > 0.01 ? 'coef-pos' : kCon < -0.01 ? 'coef-neg' : '';
    rows += `<tr>
      <td style="color:var(--text1)">${LABELS[feat]}</td>
      <td class="td-mono">${typeof val === 'number' ? val.toFixed(3) : val}</td>
      <td class="td-mono" style="color:var(--text2)">${z.toFixed(3)}</td>
      <td class="td-mono ${rCol}">${rCon >= 0 ? '+' : ''}${rCon.toFixed(3)}</td>
      <td class="td-mono ${kCol}">${kCon >= 0 ? '+' : ''}${kCon.toFixed(3)}</td>
    </tr>`;
  }
  // is_night row
  const rNight = rFE.is_night * isNight;
  const kNight = kFE.is_night * isNight;
  rows += `<tr>
    <td style="color:var(--text1)">Is night game</td>
    <td class="td-mono">${isNight}</td>
    <td class="td-mono" style="color:var(--text2)">—</td>
    <td class="td-mono ${rNight >= 0 ? 'coef-pos' : 'coef-neg'}">${rNight >= 0 ? '+' : ''}${rNight.toFixed(3)}</td>
    <td class="td-mono ${kNight >= 0 ? 'coef-pos' : 'coef-neg'}">${kNight >= 0 ? '+' : ''}${kNight.toFixed(3)}</td>
  </tr>`;
  // Park effect row
  const rPE = MODEL_PARAMS.runs.park_effects[stadium.abbr] || 0;
  const kPE = MODEL_PARAMS.strikeouts.park_effects[stadium.abbr] || 0;
  rows += `<tr style="border-top:1px solid var(--line2)">
    <td style="color:var(--text1)">Park effect (${stadium.abbr})</td>
    <td class="td-mono" colspan="2" style="color:var(--text2)">fixed effect</td>
    <td class="td-mono ${rPE >= 0 ? 'coef-pos' : 'coef-neg'}">${rPE >= 0 ? '+' : ''}${rPE.toFixed(3)}</td>
    <td class="td-mono ${kPE >= 0 ? 'coef-pos' : 'coef-neg'}">${kPE >= 0 ? '+' : ''}${kPE.toFixed(3)}</td>
  </tr>`;
  return rows;
}

function gaussianBins(mean, std, bins) {
  return bins.map(x => {
    const exponent = -0.5 * Math.pow((x - mean) / std, 2);
    return +(Math.exp(exponent) * 100 + (Math.random() - 0.5) * 4).toFixed(1);
  });
}

function renderRegressionScatters() {
  const makeScatter = (canvasId, mean, spread, slope, intercept) => {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    if (canvas._chart) canvas._chart.destroy();
    const pts = Array.from({length: 80}, () => {
      const x = mean + (Math.random()-0.5)*spread*2;
      const y = intercept + slope*x + (Math.random()-0.5)*spread*0.18;
      return { x: +x.toFixed(2), y: +y.toFixed(3) };
    });
    const lineX = [mean - spread, mean + spread];
    const lineY = lineX.map(x => intercept + slope*x);
    canvas._chart = new Chart(canvas, {
      type: 'scatter',
      data: {
        datasets: [
          { label:'Games', data: pts, backgroundColor:'rgba(61,127,255,0.25)', pointRadius:3 },
          { label:'OLS fit', data:[{x:lineX[0],y:lineY[0]},{x:lineX[1],y:lineY[1]}],
            type:'line', borderColor:'#f5c842', borderWidth:1.5, pointRadius:0, tension:0 }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{
          x:{ title:{display:true,text:'Predicted',color:'#5e6e8a',font:{size:9}}, grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#5e6e8a',font:{size:9}} },
          y:{ title:{display:true,text:'Actual',color:'#5e6e8a',font:{size:9}},    grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#5e6e8a',font:{size:9}} }
        }
      }
    });
  };
  makeScatter('reg-hrh', 0.235, 0.04, 0.82, 0.040);
  makeScatter('reg-runs', 8.8, 2.2, 0.74, 2.3);
}

// Edit 4: analog table now includes Opponent column
function renderAnalogTable(wx) {
  const tbody = document.getElementById('analog-tbody');

  // ── Real data path ────────────────────────────────────────────
  if (stadiumRows && stadiumRows.length > 0) {
    const analogs = findAnalogs(stadiumRows, wx, 6);
    if (analogs.length > 0) {
      tbody.innerHTML = analogs.map(r => {
        const dt   = new Date(r.game_date + 'T12:00:00');
        const dateStr = dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
        const opp  = r.away_team || '—';
        const temp = parseFloat(r.temp_f).toFixed(0);
        const wind = parseFloat(r.wspd_mph).toFixed(0);
        const hr   = parseFloat(r.away_bat_hr  || r.home_runs_hit || 0).toFixed(0);
        const hits = parseFloat(r.away_bat_h   || r.hits          || 0).toFixed(0);
        const k    = parseFloat(r.away_bat_k   || r.strikeouts    || 0).toFixed(0);
        const runs = parseFloat(r.away_runs_scored || 0).toFixed(0);
        return `<tr>
          <td class="td-mono" style="color:var(--text2)">${dateStr}</td>
          <td class="td-mono" style="color:var(--accent)">${opp}</td>
          <td class="td-mono">${temp}°F</td>
          <td class="td-mono">${wind} mph</td>
          <td class="td-mono">${hr}</td>
          <td class="td-mono">${hits}</td>
          <td class="td-mono">${k}</td>
          <td class="td-mono">${runs}</td>
        </tr>`;
      }).join('');
      return;
    }
  }

  // ── Placeholder fallback ──────────────────────────────────────
  const homeAbbr = STADIUMS[activeStadium].abbr;
  const opponents = MLB_TEAMS.filter(t => t !== homeAbbr);
  const rows = [];
  for (let i = 0; i < 6; i++) {
    const dt   = new Date(2022+Math.floor(Math.random()*3), Math.floor(Math.random()*7)+3, Math.floor(Math.random()*28)+1);
    const opp  = opponents[Math.floor(Math.random() * opponents.length)];
    const t    = (wx.temp + (Math.random()-0.5)*8).toFixed(0);
    const w    = Math.max(0, wx.wind + (Math.random()-0.5)*5).toFixed(0);
    const hr   = (Math.random()*2+1.5).toFixed(0);
    const hits = (Math.random()*6+6).toFixed(0);
    const k    = (Math.random()*5+7).toFixed(0);
    const runs = (Math.random()*4+5).toFixed(0);
    rows.push(`<tr>
      <td class="td-mono" style="color:var(--text2)">${dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</td>
      <td class="td-mono" style="color:var(--accent)">${opp}</td>
      <td class="td-mono">${t}°F</td>
      <td class="td-mono">${w} mph</td>
      <td class="td-mono">${hr}</td>
      <td class="td-mono">${hits}</td>
      <td class="td-mono">${k}</td>
      <td class="td-mono">${runs}</td>

  }
  tbody.innerHTML = rows.join('');
}

function renderParkFactorChart(p) {
  const canvas = document.getElementById('pf-chart');
  if (!canvas) return;
  if (window._pfChart) { window._pfChart.destroy(); }

  let labels, histData, isReal = false;

  if (stadiumRows && stadiumRows.length > 0) {
    // ── Real data path ─────────────────────────────────────────
    const pfPoints = computeRealParkFactors(stadiumRows);
    labels   = pfPoints.map(x => x.date);
    histData = pfPoints.map(x => x.pf);
    isReal   = true;
  } else {
    // ── Placeholder fallback ───────────────────────────────────
    const seed = activeStadium * 7;
    histData = Array.from({length: 60}, (_, i) => {
      const noise = Math.sin(seed + i * 0.7) * 5 + (Math.random() - 0.5) * 7;
      return +(100 + noise).toFixed(1);
    });
    labels = histData.map((_, i) => `G${i+1}`);
  }

  window._pfChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: isReal ? 'Historical PF (actual)' : 'Historical PF (placeholder)',
          data: histData,
          backgroundColor: histData.map(v => v > 100 ? 'rgba(52,199,123,0.35)' : 'rgba(232,80,80,0.35)'),
          borderRadius: 2,
          order: 2,
        },
        {
          label: "Today's model prediction",
          data: histData.map(() => p.parkFactor),
          type: 'line',
          borderColor: '#f5c842',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0,
          order: 1,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => isReal ? labels[items[0].dataIndex] : `Game ${items[0].dataIndex + 1}`,
            label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1)
          }
        }
      },
      scales: {
        x: { display: false },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#5e6e8a', font: { size: 10 } },
          title: { display: true, text: 'Park factor', color: '#5e6e8a', font: { size: 10 } }
        }
      }
    }
  });
}
